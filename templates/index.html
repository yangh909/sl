<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>资源搜索工具</title>
    <style>
        body{max-width:1000px;margin:30px auto;font-family:Arial}
        .box{padding:20px;background:#f5f5f5;border-radius:10px}
        input{width:70%;padding:10px;font-size:16px}
        button{padding:10px 20px;background:#007bff;color:white;border:none;border-radius:5px;cursor:pointer}
        table{width:100%;margin-top:20px;border-collapse:collapse}
        td,th{border:1px solid #ddd;padding:10px;text-align:left}
        th{background:#007bff;color:white}
        .export{background:#28a745;margin-top:15px}
    </style>
</head>
<body>
    <h2>📌 公开资源搜索工具（网页版 + Excel 导出）</h2>
    <div class="box">
        <form method="post">
            <input type="text" name="keyword" placeholder="输入关键词" required>
            <button type="submit">搜索</button>
        </form>

        {% if data %}
        <a href="/export?keyword={{ keyword }}">
            <button class="export">📥 导出 Excel 表格</button>
        </a>
        <table>
            <tr><th>标题</th><th>链接</th><th>来源</th></tr>
            {% for row in data %}
            <tr>
                <td>{{ row[0] }}</td>
                <td><a href="{{ row[1] }}" target="_blank">打开</a></td>
                <td>{{ row[2] }}</td>
            </tr>
            {% endfor %}
        </table>
        {% endif %}
    </div>
</body>
</html>
